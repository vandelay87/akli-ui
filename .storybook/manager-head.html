<!--
  Storybook's own favicon/manifest, distinct from Storybook's default and
  from personal-website's "a" mark. Injected here (not a hand-authored
  index.html) since Storybook reads this file verbatim into the manager
  UI's <head>. favicon.svg isn't shipped — its live Geist <text> needs
  outlining before it's safe to serve, same as personal-website.
-->
<link rel="icon" href="/favicon/favicon.ico" sizes="any" />
<link rel="icon" href="/favicon/favicon-16x16.png" sizes="16x16" type="image/png" />
<link rel="icon" href="/favicon/favicon-32x32.png" sizes="32x32" type="image/png" />
<link rel="icon" href="/favicon/favicon-48x48.png" sizes="48x48" type="image/png" />
<link rel="apple-touch-icon" sizes="180x180" href="/favicon/apple-touch-icon.png" />
<link rel="manifest" href="/site.webmanifest" />
