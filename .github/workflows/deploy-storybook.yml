name: Deploy Storybook

on:
  push:
    branches: [main]

# Unconditional on every push to main — unlike release.yml's npm publish,
# not gated behind Changesets. No pull_request trigger/branch guards needed:
# ci.yml already gates PRs, so this only ever runs against main.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read # actions/checkout
  id-token: write # OIDC token for aws-actions/configure-aws-credentials

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - uses: ./.github/actions/setup

      - name: Build Storybook
        run: pnpm build-storybook

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: arn:aws:iam::713881813802:role/storybook-deploy
          aws-region: eu-west-2

      - name: Deploy to S3
        run: |
          aws s3 sync ./storybook-static s3://${{ vars.AWS_S3_BUCKET_NAME }} \
            --delete --exclude "site.webmanifest"

      # Uploaded separately with an explicit content-type: aws s3 sync's
      # default MIME-type guessing for .webmanifest depends on the runner's
      # bundled Python version and isn't guaranteed (python/cpython#81486) —
      # a wrong guess serves application/octet-stream, which browsers reject
      # for a Web App Manifest.
      - name: Deploy site.webmanifest
        run: |
          aws s3 cp ./storybook-static/site.webmanifest \
            s3://${{ vars.AWS_S3_BUCKET_NAME }}/site.webmanifest \
            --content-type application/manifest+json

      - name: Invalidate CloudFront
        run: aws cloudfront create-invalidation --distribution-id ${{ vars.AWS_CLOUDFRONT_DISTRIBUTION_ID }} --paths "/*"
